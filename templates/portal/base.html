<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DermPaw Admin{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6f8; color: #1f2933; }
    header { background: #1f6f5c; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    header .brand { font-weight: 700; font-size: 18px; }
    header nav a { color: #e3f4ef; text-decoration: none; margin-right: 16px; }
    header nav a:hover { color: #fff; text-decoration: underline; }
    header form { margin-left: auto; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0 0 16px; }
    h2 { font-size: 18px; margin: 28px 0 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .card { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card .num { font-size: 28px; font-weight: 700; color: #1f6f5c; }
    .card .label { font-size: 13px; color: #52606d; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e4e7eb; font-size: 14px; vertical-align: top; }
    th { background: #eef2f5; font-weight: 600; }
    .btn { border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
    .btn-green { background: #1f6f5c; color: #fff; }
    .btn-red { background: #c0392b; color: #fff; }
    .btn-grey { background: #d9e2ec; color: #1f2933; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .b-green { background: #d5f5e3; color: #1e7a46; }
    .b-red { background: #fadbd8; color: #a93226; }
    .b-grey { background: #e4e7eb; color: #52606d; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
    .flash.success { background: #d5f5e3; }
    .flash.error { background: #fadbd8; }
    .muted { color: #7b8794; font-size: 13px; }
    .bar { background: #e4e7eb; border-radius: 4px; height: 10px; width: 140px; display: inline-block; vertical-align: middle; }
    .bar span { display: block; height: 100%; background: #1f6f5c; border-radius: 4px; }
    form.inline { display: inline; }
    input[type=text], input[type=email], input[type=password] { padding: 8px; border: 1px solid #cbd2d9; border-radius: 6px; width: 100%; }
    .table-wrap { overflow-x: auto; }
  </style>
</head>
<body>
  {% if admin %}
  <header>
    <span class="brand">DermPaw Admin</span>
    <nav>
      <a href="{{ url_for('portal.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('portal.vets') }}">Vet verification</a>
      <a href="{{ url_for('portal.users') }}">Users</a>
      <a href="{{ url_for('portal.reviews') }}">App reviews</a>
    </nav>
    <form method="post" action="{{ url_for('portal.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <span class="muted" style="color:#e3f4ef">{{ admin.name }}</span>
      <button class="btn btn-grey" type="submit">Log out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
